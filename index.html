<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header-box">
        <h2 class="title">Open book</h2>
      </header>
      <form action="#" id="search-form">
        <input type="search" class="search-input" id="search-input" />
      </form>
      <div class="box-container">
        <h3 class="title">Books</h3>
        <div class="book-list">
          <ul class="list">
            <li class="item">
              <span>فواید گیاه خواری</span>
              <button type="button" class="item-btn">حذف</button>
            </li>
            <li class="item">
              <span>بوف کور</span>
              <button type="button" class="item-btn">حذف</button>
            </li>
            <li class="item">
              <span>شب های روشن</span>
              <button type="button" class="item-btn">حذف</button>
            </li>
          </ul>
        </div>
      </div>
      <div class="check-box">
        <label class="container-checkbox">
          <input type="checkbox" id="check" />
          <div class="checkmark"></div>
        </label>
        <label for="check">مخفی کردن کتاب ها</label>
      </div>
      <form action="#" id="add-book">
        <input type="text" placeholder="Add book" class="add-input" />
        <button type="submit" class="add-btn">اضافه</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
